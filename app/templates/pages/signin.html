{% extends "pages/base.html" %}
{% block title %}Connexion — StockVision AI{% endblock %}
{% block content %}
<div class="auth-page-container">
    <div class="auth-card">
        <div class="auth-card-top">
            <a href="/" class="auth-back-btn" aria-label="Retour à l'accueil">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>Retour à l'accueil</span>
            </a>
        </div>

        <div class="auth-modal-header">
            <img src="/static/images/logo StockVision.png" alt="StockVision AI" class="auth-modal-logo">
            <h1 class="auth-title">Connexion</h1>
            <p class="auth-subtitle">Accédez à votre espace StockVision AI</p>
        </div>

        <div class="auth-alert auth-alert-error" id="signinError" hidden></div>
        <div class="auth-alert auth-alert-success" id="signinSuccess" hidden></div>

        <form class="auth-form" id="signinForm" novalidate>
            <div class="auth-field">
                <label for="signinEmail">Email</label>
                <input type="email" id="signinEmail" name="email" placeholder="vous@entreprise.com" required autocomplete="email" autofocus>
            </div>
            <div class="auth-field">
                <label for="signinPassword">Mot de passe</label>
                <div class="auth-password-wrap">
                    <input type="password" id="signinPassword" name="password" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="auth-toggle-pwd" data-target="signinPassword" aria-label="Afficher le mot de passe">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="auth-options">
                <label class="auth-check">
                    <input type="checkbox" name="remember">
                    <span>Se souvenir de moi</span>
                </label>
                <a href="#" class="auth-link">Mot de passe oublié ?</a>
            </div>
            <button type="submit" class="btn btn-gradient auth-submit" id="signinSubmit">
                <span class="auth-submit-text">Se connecter</span>
                <span class="auth-spinner" hidden></span>
            </button>
        </form>

        <div class="auth-divider"><span>ou continuer avec</span></div>

        <div class="auth-social">
            <button type="button" class="auth-social-btn" data-oauth="google">
                <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google
            </button>
            <button type="button" class="auth-social-btn" data-oauth="github">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                GitHub
            </button>
        </div>

        <p class="auth-switch">
            Pas encore de compte ?
            <a href="/inscription" class="auth-link">Créer un compte</a>
        </p>
    </div>
</div>
{% endblock %}
